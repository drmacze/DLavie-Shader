<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f8f6">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>DLavie Team</title>
  <base href="../../">
  <link rel="icon" type="image/svg+xml" href="assets/dlavie-mark.svg?v=72">
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f8f6;color:#141716}body{min-height:100dvh;overflow:hidden}
    .gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#f5f8f6;z-index:2}.gate-card{width:min(420px,100%);padding:28px;border:1px solid #dfe7e1;border-radius:22px;background:#fff;box-shadow:0 18px 60px rgba(14,35,22,.08);text-align:center}.gate-card img{width:46px;height:46px;border-radius:13px}.gate-card strong{display:block;margin-top:14px;font-size:18px}.gate-card span{display:block;margin-top:6px;color:#6f7872;font-size:13px}.pulse{width:34px;height:4px;margin:18px auto 0;border-radius:999px;background:#dce6df;overflow:hidden}.pulse:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#20c96b;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(125%)}}
    iframe{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f5f8f6;visibility:hidden;opacity:0;transition:opacity .16s ease}html.ready iframe{visibility:visible;opacity:1}html.ready .gate{display:none}
    @media(prefers-color-scheme:dark){html[data-theme="dark"] body,html[data-theme="dark"] .gate,html[data-theme="dark"] iframe{background:#101214;color:#f5f7f6}html[data-theme="dark"] .gate-card{background:#171a19;border-color:#2b302d}html[data-theme="dark"] .gate-card span{color:#9aa39d}}
  </style>
  <script>(function(){try{var t=localStorage.getItem('dlavie.theme.v1')||'light';if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})()</script>
</head>
<body>
  <div class="gate" aria-live="polite">
    <div class="gate-card">
      <img src="assets/dlavie-mark.svg?v=72" alt="">
      <strong>Memeriksa akses tim</strong>
      <span>Workspace internal DLavie hanya tersedia untuk akun yang diberi role.</span>
      <div class="pulse"></div>
    </div>
  </div>
  <iframe id="teamConsole" title="DLavie Team Workspace"></iframe>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (async()=>{
    const HOME='index.html';
    const ACCOUNT='account.html?v=72';
    try{
      if(!window.supabase){location.replace(HOME);return}
      const sb=window.supabase.createClient('https://ydaeukhqwishlrjyfktk.supabase.co','sb_publishable_XNXU6SVeM-D477Ymy1ORsw_4hCHOll9',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
      const {data:{session}}=await sb.auth.getSession();
      if(!session){location.replace(ACCOUNT);return}
      const {data,error}=await sb.from('dlavie_developers').select('role').eq('user_id',session.user.id).maybeSingle();
      if(error||!data){location.replace(HOME);return}
      const frame=document.getElementById('teamConsole');
      frame.addEventListener('load',()=>document.documentElement.classList.add('ready'),{once:true});
      frame.src='developer.html?embedded=1&v=72';
    }catch(_){location.replace(HOME)}
  })();
  </script>
</body>
</html>
