name: Deploy DLavie Hub

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'brand/dlavie-logo.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/site _site/brand
          cp -R site/. _site/
          cp -R site/. _site/site/
          cp brand/dlavie-logo.svg _site/brand/dlavie-logo.svg
          touch _site/.nojekyll

          # Main DLavie site.
          for html in _site/index.html _site/site/index.html; do
            sed -i '/fonts.googleapis.com/d' "$html"
            sed -i '/fonts.gstatic.com/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.css/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/gsap.min.js/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/ScrollTrigger.min.js/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.min.js/d' "$html"
            sed -i 's#\.\./pack_icon.png#assets/dlavie-shader.svg#g' "$html"
            sed -i 's/<img src="https:\/\/cdn.simpleicons.org\//<img loading="lazy" decoding="async" src="https:\/\/cdn.simpleicons.org\//g' "$html"

            python3 - "$html" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          for name in ('home-polish','home-refine','mobile-refine','modrinth-v2','modrinth-home','hero-word-fix','light-vibrant','ui-icons-v5'):
              text = re.sub(rf'\s*<link[^>]+href="{name}\.css(?:\?v=\d+)?"[^>]*>', '', text)
              text = re.sub(rf'\s*<script[^>]+src="{name}\.js(?:\?v=\d+)?"[^>]*></script>', '', text)
          for name in ('account-site-bridge','account-nav'):
              text = re.sub(rf'\s*<script[^>]+src="{name}\.js(?:\?v=\d+)?"[^>]*></script>', '', text)
          text = re.sub(r'\s*<script data-dlavie-theme-boot>.*?</script>', '', text, flags=re.S)
          text = re.sub(r'\s*<link[^>]+rel="icon"[^>]*>', '', text)

          theme_boot = '''  <script data-dlavie-theme-boot>(function(){try{var t=localStorage.getItem('dlavie.theme.v1');if(!['light','dark','system'].includes(t))t='light';var r=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.dataset.theme=r;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=r==='light'?'#f5f7f4':'#111113';}catch(e){document.documentElement.dataset.theme='light';}})();</script>'''
          text = text.replace('  <title>DLavie</title>', '  <title>DLavie</title>\n  <link rel="icon" type="image/svg+xml" href="assets/dlavie-mark.svg?v=60">\n' + theme_boot, 1)
          text = re.sub(r'assets/dlavie-mark\.svg(?:\?v=\d+)?', 'assets/dlavie-mark.svg?v=60', text)

          text = re.sub(r'href="modrinth\.css(?:\?v=\d+)?"', 'href="modrinth.css?v=57"', text)
          text = text.replace(
              '<link rel="stylesheet" href="modrinth.css?v=57">',
              '<link rel="stylesheet" href="modrinth.css?v=57">\n  <link rel="stylesheet" href="modrinth-v2.css?v=57">\n  <link rel="stylesheet" href="modrinth-home.css?v=57">\n  <link rel="stylesheet" href="hero-word-fix.css?v=57">\n  <link rel="stylesheet" href="light-vibrant.css?v=57">\n  <link rel="stylesheet" href="ui-icons-v5.css?v=60">',
              1,
          )

          text = re.sub(r'\s*<script src="auth-status-fix\.js(?:\?v=\d+)?"></script>', '', text)
          text = re.sub(r'src="modrinth\.js(?:\?v=\d+)?"', 'src="modrinth.js?v=57"', text)
          text = text.replace(
              '<script src="modrinth.js?v=57"></script>',
              '<script src="modrinth.js?v=57"></script>\n  <script src="auth-status-fix.js?v=57"></script>\n  <script src="modrinth-v2.js?v=57"></script>\n  <script src="modrinth-home.js?v=57"></script>\n  <script src="account-nav.js?v=57"></script>\n  <script src="account-site-bridge.js?v=57"></script>\n  <script src="ui-icons-v5.js?v=60"></script>',
              1,
          )
          path.write_text(text)
          PY
          done

          # Account: preserve Account v2-v4 functionality, then apply v5 visual/icon polish last.
          for html in _site/account.html _site/site/account.html; do
            python3 - "$html" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          for name in ('account-plus','account-plus-fix','account-ui-v3','account-ui-v3-fix','account-bottom-menu','ui-icons-v5'):
              text = re.sub(rf'\s*<link[^>]+href="{name}\.css(?:\?v=\d+)?"[^>]*>', '', text)
          for name in ('account-clean','account-plus','account-theme-restore','account-export-plus','account-ui-v3','account-bottom-menu','ui-icons-v5'):
              text = re.sub(rf'\s*<script[^>]+src="{name}\.js(?:\?v=\d+)?"[^>]*></script>', '', text)
          text = re.sub(r'\s*<script data-dlavie-account-theme-boot>.*?</script>', '', text, flags=re.S)
          text = re.sub(r'\s*<link[^>]+rel="icon"[^>]*>', '', text)

          theme_boot = '''  <script data-dlavie-account-theme-boot>(function(){try{var t=localStorage.getItem('dlavie.theme.v1');if(!['light','dark','system'].includes(t))t='light';var r=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.dataset.theme=r;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=r==='light'?'#f5f7f4':'#111113';}catch(e){document.documentElement.dataset.theme='light';}})();</script>'''
          text = text.replace('<title>Account — DLavie</title>', '<title>Account — DLavie</title>\n  <link rel="icon" type="image/svg+xml" href="assets/dlavie-mark.svg?v=60">\n' + theme_boot, 1)
          text = re.sub(r'assets/dlavie-mark\.svg(?:\?v=\d+)?', 'assets/dlavie-mark.svg?v=60', text)
          text = text.replace('</head>', '  <link rel="stylesheet" href="account-plus.css?v=59">\n  <link rel="stylesheet" href="account-plus-fix.css?v=59">\n  <link rel="stylesheet" href="account-ui-v3.css?v=59">\n  <link rel="stylesheet" href="account-ui-v3-fix.css?v=59">\n  <link rel="stylesheet" href="account-bottom-menu.css?v=59">\n  <link rel="stylesheet" href="ui-icons-v5.css?v=60">\n</head>', 1)

          text = re.sub(r'<script src="account\.js(?:\?v=\d+)?"></script>', '<script src="account-clean.js?v=59"></script>\n  <script src="account-plus.js?v=59"></script>\n  <script src="account-theme-restore.js?v=59"></script>\n  <script src="account-export-plus.js?v=59"></script>\n  <script src="account.js?v=59"></script>', text, count=1)
          text = re.sub(r'<script src="account-flow\.js(?:\?v=\d+)?"></script>', '<script src="account-flow.js?v=59"></script>\n  <script src="account-ui-v3.js?v=59"></script>\n  <script src="account-bottom-menu.js?v=59"></script>\n  <script src="ui-icons-v5.js?v=60"></script>', text, count=1)
          path.write_text(text)
          PY
          done

          # Strengthen password acceptance from score 2 to score 3 without changing Supabase Auth behavior.
          for js in _site/account.js _site/site/account.js; do
            python3 - "$js" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'passwordScore\(([^)]+)\)<2', r'passwordScore(\1)<3', text)
          path.write_text(text)
          PY
          done

          # Keep Home lightweight and load repository metadata only on project pages.
          for js in _site/modrinth.js _site/site/modrinth.js; do
            python3 - "$js" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('  loadHomePolish();', '  // Old home-polish layer disabled.', 1)
          text = text.replace("    scheduleIdle(()=>ensureSession(), IS_TOUCH ? 2200 : 1200);", "    // Auth resolves on demand.")
          text = re.sub(r"core\.src='modrinth-core\.js(?:\?v=\d+)?';", "core.src='modrinth-core.js?v=57';", text)
          path.write_text(text)
          PY
          done

          for js in _site/modrinth-core.js _site/site/modrinth-core.js; do
            python3 - "$js" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace(
              "bindTabs();bindProjectActions();bindProjectSearch();bindFeedback();bindSearch();bindMobileSheet();renderVotes();renderVersions();loadProjectMeta();",
              "bindTabs();bindProjectActions();bindProjectSearch();bindFeedback();bindSearch();bindMobileSheet();renderVotes();renderVersions();if(parseHash().route==='project')loadProjectMeta();",
              1,
          )
          text = text.replace(
              "window.addEventListener('hashchange',route);route();",
              "window.addEventListener('hashchange',()=>{route();if(parseHash().route==='project'&&!state.repo)loadProjectMeta();});route();",
              1,
          )
          path.write_text(text)
          PY
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
