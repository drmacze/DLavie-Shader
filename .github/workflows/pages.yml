name: Deploy DLavie Hub

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'brand/dlavie-logo.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/site _site/brand
          cp -R site/. _site/
          cp -R site/. _site/site/
          cp brand/dlavie-logo.svg _site/brand/dlavie-logo.svg
          touch _site/.nojekyll

          # Restore the original pre-home-polish Modrinth-style Home.
          # Performance fixes stay: no blocking font/animation CDNs, no background
          # Supabase request on Home, and GitHub metadata only loads on project pages.
          for html in _site/index.html _site/site/index.html; do
            sed -i '/fonts.googleapis.com/d' "$html"
            sed -i '/fonts.gstatic.com/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.css/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/gsap.min.js/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/ScrollTrigger.min.js/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.min.js/d' "$html"
            sed -i 's#\.\./pack_icon.png#assets/dlavie-shader.svg#g' "$html"
            sed -i 's/<img src="https:\/\/cdn.simpleicons.org\//<img loading="lazy" decoding="async" src="https:\/\/cdn.simpleicons.org\//g' "$html"

            python3 - "$html" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          # Explicitly remove every home-polish layer. This restores the exact
          # visual structure that existed before commit 425ba6b introduced it.
          text = re.sub(r'\s*<link[^>]+href="home-polish\.css(?:\?v=\d+)?"[^>]*>', '', text)
          text = re.sub(r'\s*<script[^>]+src="home-polish\.js(?:\?v=\d+)?"[^>]*></script>', '', text)

          text = re.sub(r'href="modrinth\.css(?:\?v=\d+)?"', 'href="modrinth.css?v=49"', text)
          text = re.sub(r'\s*<script src="auth-status-fix\.js(?:\?v=\d+)?"></script>', '', text)
          text = re.sub(r'src="modrinth\.js(?:\?v=\d+)?"', 'src="modrinth.js?v=49"', text)
          text = text.replace(
              '<script src="modrinth.js?v=49"></script>',
              '<script src="modrinth.js?v=49"></script>\n  <script src="auth-status-fix.js?v=49"></script>',
              1,
          )
          path.write_text(text)
          PY
          done

          for js in _site/modrinth.js _site/site/modrinth.js; do
            python3 - "$js" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          # The source loader still knows how to load the later polish layer.
          # Disable that call in the deployed build so Home stays pre-polish.
          text = text.replace('  loadHomePolish();', '  // Pre-polish Modrinth Home: intentionally no home-polish layer.', 1)
          text = text.replace("    scheduleIdle(()=>ensureSession(), IS_TOUCH ? 2200 : 1200);", "    // No automatic Supabase request on Home. Auth resolves on demand.")
          text = re.sub(r"core\.src='modrinth-core\.js(?:\?v=\d+)?';", "core.src='modrinth-core.js?v=49';", text)
          path.write_text(text)
          PY
          done

          for js in _site/modrinth-core.js _site/site/modrinth-core.js; do
            python3 - "$js" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace(
              "bindTabs();bindProjectActions();bindProjectSearch();bindFeedback();bindSearch();bindMobileSheet();renderVotes();renderVersions();loadProjectMeta();",
              "bindTabs();bindProjectActions();bindProjectSearch();bindFeedback();bindSearch();bindMobileSheet();renderVotes();renderVersions();if(parseHash().route==='project')loadProjectMeta();",
              1,
          )
          text = text.replace(
              "window.addEventListener('hashchange',route);route();",
              "window.addEventListener('hashchange',()=>{route();if(parseHash().route==='project'&&!state.repo)loadProjectMeta();});route();",
              1,
          )
          path.write_text(text)
          PY
          done

          # Keep the current Account visual/features unchanged.
          for html in _site/account.html _site/site/account.html; do
            sed -i '/fonts.googleapis.com/d' "$html"
            sed -i '/fonts.gstatic.com/d' "$html"
            python3 - "$html" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'\s*<link rel="stylesheet" href="account-clean\.css(?:\?v=\d+)?">', '', text)
          text = re.sub(r'href="account-flow\.css(?:\?v=\d+)?"', 'href="account-flow.css?v=49"', text)
          text = text.replace(
              '<link rel="stylesheet" href="account-flow.css?v=49">',
              '<link rel="stylesheet" href="account-flow.css?v=49">\n  <link rel="stylesheet" href="account-clean.css?v=49">',
              1,
          )
          text = re.sub(r'\s*<script src="account-clean\.js(?:\?v=\d+)?"></script>', '', text)
          text = re.sub(r'<script src="account\.js(?:\?v=\d+)?"></script>', '<script src="account.js?v=49"></script>', text)
          text = re.sub(r'<script src="account-flow\.js(?:\?v=\d+)?"></script>', '<script src="account-flow.js?v=49"></script>', text)
          text = text.replace(
              '<script src="account.js?v=49"></script>',
              '<script src="account-clean.js?v=49"></script>\n  <script src="account.js?v=49"></script>',
              1,
          )
          path.write_text(text)
          PY
          done

          for js in _site/account-flow.js _site/site/account-flow.js; do
            python3 - "$js" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("    scheduleIdle(warmHomeCache);", "    // Home navigation uses history/BFCache; no background prefetch network.")
          path.write_text(text)
          PY
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
