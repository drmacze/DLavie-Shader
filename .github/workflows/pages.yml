name: Deploy DLavie Hub

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'brand/dlavie-logo.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/site _site/brand

          # Copy every site asset first.
          cp -R site/. _site/
          cp -R site/. _site/site/
          cp brand/dlavie-logo.svg _site/brand/dlavie-logo.svg
          touch _site/.nojekyll

          # The original SPA remains available as app.html.
          cp site/index.html _site/app.html
          cp site/index.html _site/site/app.html

          # The public root Home is a standalone ultra-light document.
          cp site/home.html _site/index.html
          cp site/home.html _site/site/index.html

          # In the heavier app, Home must leave the app document and return to
          # the lightweight root shell instead of rendering the legacy Home route.
          for html in _site/app.html _site/site/app.html; do
            sed -i 's/href="#home"/href="index.html#home"/g' "$html"
            sed -i '/fonts.googleapis.com/d' "$html"
            sed -i '/fonts.gstatic.com/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.css/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/gsap.min.js/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/ScrollTrigger.min.js/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.min.js/d' "$html"
            sed -i 's/<img src="https:\/\/cdn.simpleicons.org\//<img loading="lazy" decoding="async" src="https:\/\/cdn.simpleicons.org\//g' "$html"
          done

          # Repository/release metadata is not a render dependency in app.html.
          for js in _site/modrinth-core.js _site/site/modrinth-core.js; do
            python3 - "$js" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = "bindTabs();bindProjectActions();bindProjectSearch();bindFeedback();bindSearch();bindMobileSheet();renderVotes();renderVersions();loadProjectMeta();"
          new = "bindTabs();bindProjectActions();bindProjectSearch();bindFeedback();bindSearch();bindMobileSheet();renderVotes();renderVersions();window.addEventListener('load',()=>{const run=()=>loadProjectMeta();if('requestIdleCallback' in window)requestIdleCallback(run,{timeout:2500});else setTimeout(run,1200)},{once:true});"
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
