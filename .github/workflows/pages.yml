name: Deploy DLavie Hub

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'brand/dlavie-logo.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/site _site/brand
          cp -R site/. _site/
          cp -R site/. _site/site/
          cp brand/dlavie-logo.svg _site/brand/dlavie-logo.svg
          touch _site/.nojekyll

          cp _site/index.html _site/app.html
          cp _site/site/index.html _site/site/app.html

          for html in _site/app.html _site/site/app.html; do
            sed -i '/fonts.googleapis.com/d' "$html"
            sed -i '/fonts.gstatic.com/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.css/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/gsap.min.js/d' "$html"
            sed -i '/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.13.0\/ScrollTrigger.min.js/d' "$html"
            sed -i '/unpkg.com\/lenis@1.3.26\/dist\/lenis.min.js/d' "$html"
            sed -i 's#\.\./pack_icon.png#assets/dlavie-shader.svg#g' "$html"

            python3 - "$html" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('https://cdn.simpleicons.org/github/FFFFFF', 'assets/icon-github.svg?v=70')
          text = text.replace('https://cdn.simpleicons.org/apple/FFFFFF', 'assets/icon-ios.svg?v=70')
          text = text.replace('https://cdn.simpleicons.org/android/3DDC84', 'assets/icon-android.svg?v=70')
          css_names = (
              'modrinth','home-polish','home-refine','mobile-refine','modrinth-v2','modrinth-home',
              'hero-word-fix','light-vibrant','ui-icons-v5','home-fast-v61','home-fast-v62',
              'dlavie-home-v61','dlavie-home-v63','dlavie-app-shell-v64','dlavie-app-shell-v65',
              'dlavie-app-shell-v66','dlavie-app-shell-v67','dlavie-app-shell-v68','dlavie-app-shell-v69',
              'dlavie-app-shell-v70','app-lite-v65','app-polish-v66','app-brand-v67','app-fix-v69','app-fix-v70'
          )
          for name in css_names:
              text = re.sub(rf'\s*<link[^>]+href="{name}\.css(?:\?v=\d+)?"[^>]*>', '', text)
          js_names = (
              'modrinth','home-polish','home-refine','mobile-refine','modrinth-v2','modrinth-home',
              'auth-status-fix','account-nav','account-site-bridge','ui-icons-v5','home-fast-v61','home-fast-v62',
              'dlavie-app-v61','dlavie-app-v63','dlavie-app-shell-v64','app-router-v65','app-router-v66',
              'app-router-v67','app-router-v68','app-router-v69','app-router-v70','app-polish-v66','app-brand-v67',
              'app-projects-v69','app-brand-v70'
          )
          for name in js_names:
              text = re.sub(rf'\s*<script[^>]+src="{name}\.js(?:\?v=\d+)?"[^>]*></script>', '', text)
          text = re.sub(r'\s*<script data-dlavie-theme-boot>.*?</script>', '', text, flags=re.S)
          text = re.sub(r'\s*<link[^>]+rel="icon"[^>]*>', '', text)
          text = text.replace('href="#home"', 'href="index.html"')
          theme_boot = '''  <script data-dlavie-theme-boot>(function(){try{var t=localStorage.getItem('dlavie.theme.v1');if(!['light','dark','system'].includes(t))t='light';var r=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.dataset.theme=r;}catch(e){document.documentElement.dataset.theme='light';}})();</script>'''
          app_guard = '''  <script>(function(){var h=(location.hash||'').replace(/^#\\/?/,'');if(!h||h==='home')location.replace('index.html');})();</script>'''
          text = text.replace('  <title>DLavie</title>', '  <title>DLavie</title>\n  <link rel="icon" type="image/svg+xml" href="assets/dlavie-mark.svg?v=70">\n' + theme_boot + '\n' + app_guard, 1)
          text = re.sub(r'assets/dlavie-mark\.svg(?:\?v=\d+)?', 'assets/dlavie-mark.svg?v=70', text)
          text = text.replace('</head>', '  <link rel="stylesheet" href="dlavie-app-shell-v70.css?v=70">\n</head>', 1)
          text = text.replace('</body>', '  <script src="app-router-v70.js?v=70"></script>\n</body>', 1)
          path.write_text(text)
          PY
          done

          for html in _site/account.html _site/site/account.html; do
            python3 - "$html" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1]); text = path.read_text()
          for name in ('account-plus','account-plus-fix','account-ui-v3','account-ui-v3-fix','account-bottom-menu','ui-icons-v5'):
              text = re.sub(rf'\s*<link[^>]+href="{name}\.css(?:\?v=\d+)?"[^>]*>', '', text)
          for name in ('account-clean','account-plus','account-theme-restore','account-export-plus','account-ui-v3','account-bottom-menu','ui-icons-v5'):
              text = re.sub(rf'\s*<script[^>]+src="{name}\.js(?:\?v=\d+)?"[^>]*></script>', '', text)
          text = re.sub(r'\s*<script data-dlavie-account-theme-boot>.*?</script>', '', text, flags=re.S)
          text = re.sub(r'\s*<link[^>]+rel="icon"[^>]*>', '', text)
          theme_boot = '''  <script data-dlavie-account-theme-boot>(function(){try{var t=localStorage.getItem('dlavie.theme.v1');if(!['light','dark','system'].includes(t))t='light';var r=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.dataset.theme=r;}catch(e){document.documentElement.dataset.theme='light';}})();</script>'''
          text = text.replace('<title>Account — DLavie</title>', '<title>Account — DLavie</title>\n  <link rel="icon" type="image/svg+xml" href="assets/dlavie-mark.svg?v=70">\n' + theme_boot, 1)
          text = text.replace('</head>', '  <link rel="stylesheet" href="account-plus.css?v=59">\n  <link rel="stylesheet" href="account-plus-fix.css?v=59">\n  <link rel="stylesheet" href="account-ui-v3.css?v=59">\n  <link rel="stylesheet" href="account-ui-v3-fix.css?v=59">\n  <link rel="stylesheet" href="account-bottom-menu.css?v=71">\n  <link rel="stylesheet" href="ui-icons-v5.css?v=60">\n</head>', 1)
          text = re.sub(r'<script src="account\.js(?:\?v=\d+)?"></script>', '<script src="account-clean.js?v=59"></script>\n  <script src="account-plus.js?v=59"></script>\n  <script src="account-theme-restore.js?v=59"></script>\n  <script src="account-export-plus.js?v=59"></script>\n  <script src="account.js?v=59"></script>', text, count=1)
          text = re.sub(r'<script src="account-flow\.js(?:\?v=\d+)?"></script>', '<script src="account-flow.js?v=59"></script>\n  <script src="account-ui-v3.js?v=59"></script>\n  <script src="account-bottom-menu.js?v=71"></script>\n  <script src="ui-icons-v5.js?v=60"></script>', text, count=1)
          path.write_text(text)
          PY
          done

          for js in _site/account.js _site/site/account.js; do
            python3 - "$js" <<'PY'
          import pathlib, re, sys
          path=pathlib.Path(sys.argv[1]); text=path.read_text(); text=re.sub(r'passwordScore\(([^)]+)\)<2',r'passwordScore(\1)<3',text); path.write_text(text)
          PY
          done

          for root in _site _site/site; do
            cat "$root/modrinth.css" "$root/modrinth-v2.css" "$root/light-vibrant.css" "$root/app-lite-v65.css" "$root/app-polish-v66.css" "$root/app-brand-v67.css" "$root/app-fix-v69.css" "$root/app-fix-v70.css" > "$root/dlavie-app-shell-v70.css"
            cat "$root/app-router-v65.js" "$root/app-polish-v66.js" "$root/app-brand-v67.js" "$root/app-projects-v69.js" "$root/app-brand-v70.js" > "$root/app-router-v70.js"
          done

          cp _site/home-static.html _site/index.html
          cp _site/site/home-static.html _site/site/index.html
          for html in _site/index.html _site/site/index.html; do
            python3 - "$html" <<'PY'
          import pathlib,re,sys
          path=pathlib.Path(sys.argv[1]); text=path.read_text(); root=path.parent
          text=re.sub(r'app\.html\?v=\d+','app.html?v=70',text)
          text=re.sub(r'assets/dlavie-mark\.svg\?v=\d+','assets/dlavie-mark.svg?v=70',text)
          css=root/'home-brand-v67.css'; js=root/'home-brand-v67.js'
          if css.exists() and 'data-v70-brand' not in text: text=text.replace('</head>','<style data-v70-brand>\n'+css.read_text()+'\n</style></head>',1)
          if js.exists() and 'data-v70-brand' not in text: text=text.replace('</body>','<script data-v70-brand>\n'+js.read_text().replace('?v=68','?v=70').replace('?v=69','?v=70')+'\n</script></body>',1)
          path.write_text(text)
          PY
          done

          for html in _site/developer.html _site/site/developer.html; do
            python3 - "$html" <<'PY'
          import pathlib,re,sys
          path=pathlib.Path(sys.argv[1]); text=path.read_text()
          text=re.sub(r'assets/dlavie-mark\.svg\?v=\d+','assets/dlavie-mark.svg?v=73',text)
          text=re.sub(r'assets/icon-github\.svg\?v=\d+','assets/icon-github.svg?v=73',text)
          text=re.sub(r'app\.html\?v=\d+','app.html?v=70',text)
          text=text.replace('</head>','  <link rel="stylesheet" href="developer-fix-v70.css?v=73">\n</head>',1)
          text=text.replace('</body>','  <script src="developer-fix-v70.js?v=73"></script>\n</body>',1)
          path.write_text(text)
          PY
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
